name: release

on:
    push:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache Node modules
              id: node-cache
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('package-lock.json') }}

            - name: Install Node modules
              if: steps.node-cache.outputs.cache-hit != 'true'
              run: npm install

            - name: Build plugin
              run: npm run build

            - name: Build
              run: docker build -t zotero docker/

            - name: Check Zotero version
              run: docker run -i --rm --name zotero zotero -c "xvfb-run zotero --full-version"

            # For some reason these tests only work if the container is in interactive mode and not detached...
            - name: run tests
              run: echo 'bash -c "echo $(readlink -f build) >> .zotero/zotero/abcdefgh.test/extensions/api-endpoint@hotmail.com && xvfb-run zotero & sleep 5s && newman run test/zotero-api-endpoint.postman_collection.json -g test/workspace.postman_globals.json --verbose"' | docker run -i --rm -v $(readlink -f build):/home/zotero/build -v $(readlink -f test):/home/zotero/test --name zotero zotero

    release:
        runs-on: ubuntu-latest
        needs: test
        # only trigger when tagged with a version
        if: startsWith(github.event.ref, 'refs/tags/v')
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: install node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache node dependencies
              uses: actions/cache@v4
              env:
                  cache-name: cache-dependencies
              with:
                  path: |
                      ~/.npm
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: install node dependencies
              run: npm install

            - name: build
              run: npm run build

            - name: release
              run: |
                  npm run release -- --no-increment --no-git --github.release --ci --VV
                  sleep 1s
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: release update.json
              uses: softprops/action-gh-release@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: release
                  files: build/update*.json
                  make_latest: false

            - name: Notify release
              uses: apexskier/github-release-commenter@v1
              continue-on-error: true
              with:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  comment-template: |
                      :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._
